<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Mi Portfolio Personal</h1>
        <p>Desarrollador Web en formación</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre.html">Sobre mí</a></li>
            <li><a href="contacto.html" class="activo">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section class="caja-contenido">
            <h2>Contacto</h2>
            <p>¿Tienes alguna propuesta o sugerencia? ¡Escríbeme!</p>

            <form action="#" method="post" class="form-contacto">
                <div class="grupo-form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="grupo-form">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                </div>

                <div class="grupo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Mi Portfolio Personal. Todos los derechos reservados.</p>
        <p class="copy-peq">Diseñado (con mucho caos) para la clase de DIW.</p>
    </footer>

</body>
</html>
